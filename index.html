<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusFix | Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">

    <style>
        :root {
            --campusfix-blue: #05294D;
        }

        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }

        .brand-highlight {
            color: var(--campusfix-blue);
        }

        .btn-primary {
            background-color: var(--campusfix-blue);
            border-color: var(--campusfix-blue);
        }

        .btn-primary:hover {
            background-color: #041f3a;
            border-color: #041f3a;
        }

        .landing-container {
            max-width: 500px;
            margin: auto;
            text-align: center;
        }

        footer {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="#">
            <span class="brand-highlight">Campus</span>Fix
        </a>
    </div>
</nav>

<!-- Landing Content -->
<div class="container d-flex align-items-center flex-grow-1">
    <div class="landing-container w-100">

        <h2 class="mb-4">Welcome to CampusFix</h2>
        <p class="mb-4">Smart Campus Facility Maintenance System</p>

        <div class="d-grid gap-3">
            <a href="ticket.html" class="btn btn-primary btn-lg">
                Report Issue
            </a>

            <a href="login.html" class="btn btn-outline-secondary btn-lg">
                Staff Login
            </a>
        </div>

    </div>
</div>

<!-- Footer -->
<footer class="text-center mb-3">
    © 2026 CampusFix · www.campusfix.com
</footer>

</body>
</html>
