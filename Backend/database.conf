# CampusFix Priority Dispatcher Configuration File
# This file defines database connection parameters

# Database host (default: localhost)
host=localhost

# Database port (default: 33060 for MySQL X Protocol)
port=33060

# Database user (default: root)
user=root

# Database password (leave blank for no password)
password=

# Database name (default: campusfix_db)
database=campusfix_db

# Enable demo mode - run without database (default: false)
demo_mode=false

# Enable verbose output (default: true)
verbose=true

# Example configurations for different scenarios:

# For remote MySQL server:
# host=db.example.com
# port=33060
# user=campusfix_user
# password=secure_password
# database=production_db

# For local development with different database:
# database=campusfix_dev

# For silent/batch mode:
# verbose=false
