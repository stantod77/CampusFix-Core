<!DOCTYPE html>
<html>
<head>
    <title>CampusFix - Submit Ticket</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        :root { --navy: #0b1f3a; }
        body { background: #f4f4f4; padding: 0; font-family: sans-serif; }
        .navbar { background: white; border-bottom: 3px solid var(--navy); padding: 10px 20px; display: flex; align-items: center; justify-content: flex-start; }
        .cf-logo { background: var(--navy); color: white; padding: 5px 12px; border-radius: 6px; font-weight: 800; margin-right: 8px; font-size: 20px; }
        .brand-name { color: var(--navy); font-weight: 800; font-size: 22px; text-decoration: none; display: flex; align-items: center; }
        .ticket-container { background: white; padding: 30px; border-radius: 12px; max-width: 600px; margin: 40px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-navy { background-color: var(--navy); color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px; }
        label { font-weight: 600; color: #333; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand-name">
            <span class="cf-logo">CF</span>
            <span>CampusFix</span>
        </div>
    </div>

    <div class="ticket-container">
        <h2 style="color: var(--navy); margin-bottom: 25px; font-weight: 800; text-align: center;">Submit Ticket</h2>
        <form action="submit_ticket.php" method="POST">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="requester_name" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="requester_email" class="form-control" required>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>Building</label>
                    <select name="building" class="form-control">
                        <option value="Main Hall">Main Hall</option>
                        <option value="Science Center">Science Center</option>
                        <option value="Library">Library</option>
                        <option value="Dormitory A">Dormitory A</option>
                        <option value="Student Union">Student Union</option>
                    </select>
                </div>
                <div class="form-group col-md-6">
                    <label>Room Number</label>
                    <input type="text" name="room_number" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label>Severity Level</label>
                <select name="severity" class="form-control">
                    <option value="1">1 - Low Priority</option>
                    <option value="2">2 - Minor Issue</option>
                    <option value="3">3 - Standard</option>
                    <option value="4">4 - High Priority</option>
                    <option value="5">5 - Emergency</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description of Issue</label>
                <textarea name="description" class="form-control" rows="4" required placeholder="Describe the problem..."></textarea>
            </div>

            <button type="submit" class="btn-navy">Submit Ticket</button>
        </form>
    </div>
</body>
</html>
