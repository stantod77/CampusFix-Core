<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusFix | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">

    <style>
        :root {
            --campusfix-blue: #05294D;
        }

        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }

        .brand-highlight {
            color: var(--campusfix-blue);
        }

        .btn-primary {
            background-color: var(--campusfix-blue);
            border-color: var(--campusfix-blue);
        }

        .btn-primary:hover {
            background-color: #041f3a;
            border-color: #041f3a;
        }

        .landing-container {
            max-width: 500px;
            margin: auto;
            text-align: center;
        }

        footer {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="#">
            <span class="brand-highlight">Campus</span>Fix
        </a>
        <span class="navbar-text">
            Smart Campus Maintenance
        </span>
    </div>
</nav>

<!-- Login Form -->
<div class="container d-flex align-items-center flex-grow-1">
    <div class="login-container w-100">

        <h4 class="text-center mb-4">User Login</h4>

        <form action="login_process.php" method="POST">

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input 
                    type="email" 
                    name="email"
                    class="form-control"
                    placeholder="name@campusfix.com"
                    required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input 
                    type="password" 
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>

            <!-- Forgot Password -->
            <div class="text-center mt-3">
                <a href="#" class="text-decoration-none">
                    Forgot Password?
                </a>
            </div>

        </form>
    </div>
</div>

<!-- Footer -->
<footer class="text-center mb-3">
    © 2026 CampusFix · www.campusfix.com
</footer>

</body>
</html>
